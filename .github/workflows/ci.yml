name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools for the backup-script tests
        run: sudo apt-get update && sudo apt-get install -y rsync sqlite3 shellcheck
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Shellcheck
        run: shellcheck scripts/* examples/keepalived/check-pihole-dns examples/keepalived/keepalived-notify-ntfy
      - name: Tests
        run: pytest --cov=homelab_tools --cov-report=term-missing
