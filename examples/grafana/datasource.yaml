# Grafana provisioning: VictoriaMetrics as a Prometheus-compatible data source.
# The example dashboards refer to it by uid "vm".
apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    jsonData:
      timeInterval: 60s
