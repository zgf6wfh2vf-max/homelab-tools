# keepalived for two Pi-holes sharing one DNS address (primary).
# Your DHCP server hands out the shared address (192.168.1.53 here) as the DNS server. The primary
# holds it while its Pi-hole answers; otherwise the secondary takes over within a few seconds and
# hands it back 30 s after the primary recovers. Use the same auth_pass on both (8 characters max).
global_defs {
  enable_script_security
  script_user root
}

vrrp_script pihole_dns {
  script "/usr/local/bin/check-pihole-dns"
  interval 5
  timeout 4
  fall 2
  rise 2
}

vrrp_instance DNS {
  state BACKUP                # both start as BACKUP; priority decides who becomes MASTER
  interface eth0
  virtual_router_id 53
  priority 150
  advert_int 1
  preempt_delay 30
  unicast_src_ip 192.168.1.2
  unicast_peer {
    192.168.1.3
  }
  authentication {
    auth_type PASS
    auth_pass CHANGE_ME
  }
  virtual_ipaddress {
    192.168.1.53/24 dev eth0 label eth0:dns
  }
  track_script {
    pihole_dns
  }
  notify /usr/local/bin/keepalived-notify-ntfy
}
