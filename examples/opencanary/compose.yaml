# OpenCanary honeypot on its own LAN address, pretending to be a NAS.
# A macvlan network gives the container its own IP and MAC on your LAN, so it looks like a separate
# device. Note: the Docker host itself cannot reach macvlan containers - test from another machine.
services:
  opencanary:
    image: thinkst/opencanary:latest
    container_name: opencanary
    hostname: nas01
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    networks:
      lan:
        ipv4_address: 192.168.1.240          # an unused address OUTSIDE your DHCP range
    mac_address: "00:11:32:4a:7c:19"         # a Synology-style prefix makes the "NAS" look plausible
    volumes:
      - ./opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - ./logs:/var/log/opencanary            # root-owned: with cap_drop ALL, root has no DAC override

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
          ip_range: 192.168.1.240/32
